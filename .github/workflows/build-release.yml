# credit: https://data-dive.com/multi-os-deployment-in-cloud-using-pyinstaller-and-github-actions
name: Build Release Binaries
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build packages
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            TARGET: macos
          - os: windows-latest
            TARGET: windows
          - os: ubuntu-latest
            TARGET: linux
    steps:
    - name: Checkout SCM
      uses: actions/checkout@v5
      # https://github.com/actions/checkout
    - name: Set up Python 3.14
      uses: actions/setup-python@v6.1.0
      # https://github.com/actions/setup-python
      with:
        python-version: "3.14"
    - name: Extract version from tag
      id: get_version
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"
    #-----------------------------------------------
    #  -----  install Poetry and Dependencies  -----
    #-----------------------------------------------
    - name: Install Poetry & Dependencies
      run: |
        python -m pip install -U pip poetry
        poetry config virtualenvs.in-project true --local
        poetry install
    - name: Build with PyInstaller
      run: |
        poetry run python build.py ${{ steps.get_version.outputs.version }}
    - name: Upload artifact
      uses: actions/upload-artifact@v5.0.0
      # https://github.com/actions/upload-artifact
      with:
        path: ./dist/
        name: mtg-art-downloader-v${{ steps.get_version.outputs.version }}-${{ matrix.TARGET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v7.0.0
      # https://github.com/actions/download-artifact
      with:
        path: ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2.5.0
      with:
        files: ./artifacts/**/*.zip
        draft: false
        prerelease: false
        generate_release_notes: true
